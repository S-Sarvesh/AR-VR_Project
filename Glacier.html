  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Get 3D UI elements
      const startButton = document.getElementById('start-button');
      const resetButton = document.getElementById('reset-button');
      const meltLabel = document.getElementById('melt-label');
      const barFill = document.getElementById('bar-fill');
      const barFillBasePos = barFill.getAttribute('position');

      // === ADDED HOME BUTTON LOGIC ===
      const homeButton = document.getElementById("homeButton");
      homeButton.addEventListener("click", () => {
        window.location.href = "index.html";
      });
      // =============================

      // Get scene elements
      const water = document.getElementById('water-plane');
      const icebergs = document.querySelectorAll('.iceberg');

      // --- Constants for animation ---
      const waterBaseY = -0.5;
      const waterTargetY = 0.5;
      const waterBaseOpacity = 0.2;
      const waterTargetOpacity = 0.8;
      // This MUST match the width of #bar-bg in the HTML
      const totalBarWidth = 1.8; 
      
      // --- Simulation state ---
      let animationFrameId = null;
      let isSimulating = false;
      // Total duration for the melt animation (in milliseconds)
      const simulationDuration = 5000; // 5 seconds

      /**
       * Main function to update all visual elements based on a melt level (0-100).
       */
      function updateScene(meltLevel) {
        const k = meltLevel / 100; // Melt factor (0.0 to 1.0)

        // 1. Update UI Label
        meltLabel.setAttribute('text', 'value', `Greenhouse Gas Emission Level: ${Math.round(meltLevel)}%`);

        // 2. Update Progress Bar
        const fillWidth = totalBarWidth * k;
        // Calculate new X position to make the bar fill from the left
        const fillPosX = (fillWidth / 2) - (totalBarWidth / 2);
        
        barFill.setAttribute('width', fillWidth);
        barFill.setAttribute('position', { x: fillPosX, y: barFillBasePos.y, z: barFillBasePos.z });

        // 3. Update Water Plane
        const waterNewY = waterBaseY + (waterTargetY - waterBaseY) * k;
        const waterNewOpacity = waterBaseOpacity + (waterTargetOpacity - waterBaseOpacity) * k;
        
        water.setAttribute('position', `0 ${waterNewY} 0`);
        water.setAttribute('material', 'opacity', waterNewOpacity);

        // 4. Update all Icebergs
        icebergs.forEach(iceberg => {
          // Get original values from the data- attributes
          const basePosY = Number(iceberg.dataset.basePosY);
          const baseScaleY = Number(iceberg.dataset.baseScaleY);

          // These are the exact formulas from your original code
          const newScaleY = baseScaleY * (1 - k * 0.95);
          const newPosY = basePosY * (1 - k) - (baseScaleY / 2) * k;
          const newOpacity = 1 - k * 0.5;

          // Get current position/scale to only update the Y value
          const position = iceberg.getAttribute('position');
          const scale = iceberg.getAttribute('scale');

          iceberg.setAttribute('position', { x: position.x, y: newPosY, z: position.z });
          iceberg.setAttribute('scale', { x: scale.x, y: newScaleY, z: scale.z });
          iceberg.setAttribute('material', 'opacity', newOpacity);
        });
      }

      /**
       * The animation loop that runs every frame using requestAnimationFrame.
       */
      function animateSimulation(startTime) {
        const elapsedTime = performance.now() - startTime;
        let meltLevel = (elapsedTime / simulationDuration) * 100;

        if (meltLevel >= 100) {
          // --- Simulation complete ---
          meltLevel = 100;
          isSimulating = false;
          updateScene(meltLevel);
          cancelAnimationFrame(animationFrameId);
          return; // Stop the loop
        }

        // --- Simulation in progress ---
        updateScene(meltLevel);
        // Request the next frame
        animationFrameId = requestAnimationFrame(() => animateSimulation(startTime));
      }

      /**
       * "Start" button click handler
       */
      function startSimulation() {
        if (isSimulating) return; // Don't start if already running
        isSimulating = true;
        cancelAnimationFrame(animationFrameId); // Clear any previous loop
        
        // Record the start time and begin the animation loop
        const startTime = performance.now();
        animateSimulation(startTime);
      }

      /**
       * "Reset" button click handler
       */
      function resetSimulation() {
        isSimulating = false;
        cancelAnimationFrame(animationFrameId); // Stop any running simulation
        updateScene(0); // Reset everything to 0%
      }

      // --- Attach event listeners to the 3D buttons ---
      startButton.addEventListener('click', startSimulation);
      resetButton.addEventListener('click', resetSimulation);
    });
  </script>
