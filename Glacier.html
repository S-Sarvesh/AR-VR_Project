<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ball Collision Simulation</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        overflow: hidden;
      }
      #ui-container {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 10;
      }
      canvas {
        background: white;
      }
    </style>
  </head>

  <body>

    <!-- ✅ VR CLICK BRIDGE (NEW) -->
    <script>
      AFRAME.registerComponent('vr-start-listener', {
        init: function () {
          this.el.addEventListener('click', () => {
            document.getElementById('start-button')?.dispatchEvent(new Event('click'));
          });
        }
      });

      AFRAME.registerComponent('vr-reset-listener', {
        init: function () {
          this.el.addEventListener('click', () => {
            document.getElementById('reset-button')?.dispatchEvent(new Event('click'));
          });
        }
      });
    </script>

    <!-- UI -->
    <div id="ui-container" class="p-4 bg-white bg-opacity-80 rounded shadow">
      <div class="mb-2">
        <label class="block font-medium">Ball A Mass (kg)</label>
        <input id="massA" type="number" value="2" class="p-1 border rounded w-32" />
      </div>

      <div class="mb-2">
        <label class="block font-medium">Ball B Mass (kg)</label>
        <input id="massB" type="number" value="3" class="p-1 border rounded w-32" />
      </div>

      <div class="mb-2">
        <label class="block font-medium">Initial Velocity (m/s)</label>
        <input id="initialVelocity" type="number" value="0" class="p-1 border rounded w-32" />
      </div>

      <button id="start-button" class="px-4 py-2 bg-green-600 text-white rounded mt-2">
        Start Simulation
      </button>

      <button id="reset-button" class="px-4 py-2 bg-red-600 text-white rounded mt-2">
        Reset
      </button>
    </div>

    <canvas id="velocityChart" width="500" height="200"></canvas>

    <a-scene renderer="antialias: true" background="color: #ECECEC">

      <!-- Camera + controllers -->
      <a-entity position="0 1.6 3">
        <a-camera>
          <a-entity laser-controls="hand: right"></a-entity>
        </a-camera>
      </a-entity>

      <!-- Plane -->
      <a-plane position="0 0 -4" rotation="-90 0 0" width="20" height="20" color="#ccc"></a-plane>

      <!-- Ball A -->
      <a-sphere id="ballA" radius="0.25" color="red" position="-2 1.5 -3"></a-sphere>

      <!-- Ball B -->
      <a-sphere id="ballB" radius="0.30" color="blue" position="2 1.5 -3"></a-sphere>

      <!-- ✅ Start Button in VR (added vr-start-listener) -->
      <a-entity id="start-button" class="clickable" vr-start-listener
                geometry="primitive: plane; width: 1.5; height: 0.5"
                material="color: #4CAF50"
                position="-1 2 -2"
                text="value: Start Simulation; align: center; color: white">
      </a-entity>

      <!-- ✅ Reset Button in VR (added vr-reset-listener) -->
      <a-entity id="reset-button" class="clickable" vr-reset-listener
                geometry="primitive: plane; width: 1.5; height: 0.5"
                material="color: #E53935"
                position="1 2 -2"
                text="value: Reset; align: center; color: white">
      </a-entity>

      <!-- LIGHT -->
      <a-entity light="type: directional; intensity: 1" position="0 5 5"></a-entity>

      <!-- ✅ CUSTOM RAYCAST — UNCHANGED -->
      <script>
        AFRAME.registerComponent("laser-listener", {
          init: function () {
            const el = this.el;
            let hasInteracted = false;

            el.addEventListener("triggerdown", function () {
              if (hasInteracted) return;
              hasInteracted = true;

              const origin = new THREE.Vector3();
              const direction = new THREE.Vector3(0, 0, -1);
              const matrixWorld = el.object3D.matrixWorld;

              origin.setFromMatrixPosition(matrixWorld);
              direction.transformDirection(matrixWorld);

              const raycaster = new THREE.Raycaster(origin, direction);
              const clickableEls = document.getElementsByClassName("clickable");
              const objectList = [];

              for (let i = 0; i < clickableEls.length; i++) {
                if (clickableEls[i].object3D) objectList.push(clickableEls[i].object3D);
              }

              const intersects = raycaster.intersectObjects(objectList, true);

              if (intersects.length > 0) {
                let clicked = intersects[0].object.el;
                clicked.dispatchEvent(new MouseEvent("click"));
              }
            });

            el.addEventListener("triggerup", function () {
              hasInteracted = false;
            });
          },
        });
      </script>

      <a-entity laser-controls="hand: right" laser-listener></a-entity>

    </a-scene>

    <!-- ✅ YOUR EXISTING PHYSICS + CHART CODE (UNCHANGED) -->
    <script>
      const ballA = document.getElementById("ballA");
      const ballB = document.getElementById("ballB");

      const ctx = document.getElementById("velocityChart").getContext("2d");
      let chart = new Chart(ctx, {
        type: "line",
        data: {
          labels: [],
          datasets: [
            { label: "Ball A Velocity (m/s)", data: [], borderColor: "red", fill: false },
            { label: "Ball B Velocity (m/s)", data: [], borderColor: "blue", fill: false }
          ]
        },
        options: { responsive: false }
      });

      let animationRunning = false;
      let t = 0;
      let vA = 0;
      let vB = 0;
      let mA, mB;

      document.getElementById("start-button").addEventListener("click", () => {
        if (animationRunning) return;
        animationRunning = true;

        mA = parseFloat(document.getElementById("massA").value);
        mB = parseFloat(document.getElementById("massB").value);
        let v0 = parseFloat(document.getElementById("initialVelocity").value);

        vA = v0;
        vB = 0;
        t = 0;

        chart.data.labels = [];
        chart.data.datasets[0].data = [];
        chart.data.datasets[1].data = [];
        chart.update();

        simulate();
      });

      document.getElementById("reset-button").addEventListener("click", () => {
        animationRunning = false;
        ballA.setAttribute("position", "-2 1.5 -3");
        ballB.setAttribute("position", "2 1.5 -3");
        chart.data.labels = [];
        chart.data.datasets[0].data = [];
        chart.data.datasets[1].data = [];
        chart.update();
      });

      function simulate() {
        if (!animationRunning) return;

        let posA = ballA.object3D.position;
        let posB = ballB.object3D.position;

        posA.x += vA * 0.02;
        posB.x += vB * 0.02;

        if (posA.distanceTo(posB) <= 0.55) {
          let newVA = (vA * (mA - mB)) / (mA + mB);
          let newVB = (2 * mA * vA) / (mA + mB);

          vA = newVA;
          vB = newVB;
        }

        t += 0.02;
        chart.data.labels.push(t.toFixed(2));
        chart.data.datasets[0].data.push(vA);
        chart.data.datasets[1].data.push(vB);
        chart.update();

        requestAnimationFrame(simulate);
      }
    </script>

  </body>
</html>
