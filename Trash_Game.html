<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Trash Sorting Game – Fixed</title>

    <!-- A-Frame + Extras -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

    <style>
      /* Hide raycaster line safely */
      .raycaster-line,
      .rayLine {
        display: none !important;
      }
    </style>
  </head>

  <body>
    <a-scene
      cursor="rayOrigin: mouse"
      renderer="antialias: true"
      background="color: #87CEFA"
    >

      <!-- ========================================================= -->
      <!-- CAMERA + ONE RIGHT CONTROLLER (INVISIBLE)                 -->
      <!-- ========================================================= -->

      <a-entity id="player" position="0 1.6 3">
        <a-camera></a-camera>

        <!-- Right-hand VR controller (hidden model, input still works) -->
        <a-entity
          id="rightHand"
          laser-controls="hand: right"
          raycaster="objects: .clickable"
          visible="false"
        ></a-entity>
      </a-entity>

      <!-- ========================================================= -->
      <!-- LIGHTS / ENVIRONMENT                                      -->
      <!-- ========================================================= -->

      <a-entity light="type: directional; intensity: 1" position="1 3 2"></a-entity>
      <a-entity light="type: ambient; intensity: 0.7"></a-entity>

      <!-- Floor -->
      <a-plane
        rotation="-90 0 0"
        width="30"
        height="30"
        color="#4CAF50"
      ></a-plane>

      <!-- ========================================================= -->
      <!-- CLICKABLE LOGIC COMPONENT                                 -->
      <!-- ========================================================= -->

      <script>
        AFRAME.registerComponent("make-clickable", {
          init() {
            this.el.classList.add("clickable");
            this.el.addEventListener("click", () => {
              this.el.sceneEl.systems["game-manager"]?.handleClick(this.el);
            });
          }
        });
      </script>

      <!-- ========================================================= -->
      <!-- EXPLICIT RAYCAST — REPLACES CONTROLLER RAY                -->
      <!-- ========================================================= -->

      <script>
        AFRAME.registerComponent("explicit-raycast", {
          init: function () {
            const player = document.querySelector("#player");
            const rightHand = document.querySelector("#rightHand");
            const scene = this.el.sceneEl;

            window.addEventListener("triggerdown", () => {
              const origin = new THREE.Vector3();
              const direction = new THREE.Vector3();

              rightHand.object3D.getWorldPosition(origin);
              rightHand.object3D.getWorldDirection(direction);

              const raycaster = new THREE.Raycaster(origin, direction, 0, 100);

              const clickable = Array.from(scene.querySelectorAll(".clickable"));
              const targets = clickable.map(el => el.object3D);

              const hits = raycaster.intersectObjects(targets, true);

              if (hits.length > 0) {
                const clickedObj = hits[0].object.el;
                clickedObj.dispatchEvent(new MouseEvent("click"));
              }
            });
          }
        });
      </script>

      <!-- Attach explicit raycast to scene -->
      <a-entity explicit-raycast></a-entity>

      <!-- ========================================================= -->
      <!-- GAME MANAGER                                              -->
      <!-- ========================================================= -->

      <script>
        AFRAME.registerSystem("game-manager", {
          init() {
            this.score = 0;
            this.updateScoreDisplay();
            this.spawnInitialTrash();
          },

          updateScoreDisplay() {
            document.querySelector("#scoreText").setAttribute(
              "value",
              "Score: " + this.score
            );
          },

          handleClick(el) {
            if (el.classList.contains("trash")) {
              this.heldTrash = el;
              return;
            }

            if (el.classList.contains("bin") && this.heldTrash) {
              const expected = this.heldTrash.getAttribute("data-type");
              const actual = el.getAttribute("data-bin");

              if (expected === actual) {
                this.score += 10;
                this.heldTrash.parentNode.removeChild(this.heldTrash);

                this.spawnTrash();
              } else {
                this.score -= 5;
              }

              this.updateScoreDisplay();
              this.heldTrash = null;
            }

            if (el.id === "resetBtn3D") {
              location.reload();
            }

            if (el.id === "homeButton") {
              window.location.href = "../index.html";
            }
          },

          spawnInitialTrash() {
            for (let i = 0; i < 6; i++) this.spawnTrash();
          },

          spawnTrash() {
            const types = ["organic", "plastic", "metal"];
            const type = types[Math.floor(Math.random() * types.length)];

            const trash = document.createElement("a-box");
            trash.setAttribute("class", "trash");
            trash.setAttribute("data-type", type);
            trash.setAttribute("make-clickable", "");
            trash.setAttribute("depth", 0.3);
            trash.setAttribute("height", 0.3);
            trash.setAttribute("width", 0.3);
            trash.setAttribute("color", "#"+Math.floor(Math.random()*16777215).toString(16));

            trash.setAttribute(
              "position",
              `${(Math.random() - 0.5) * 6} 0.3 ${(Math.random() - 0.5) * -5}`
            );

            this.el.appendChild(trash);
          }
        });
      </script>

      <!-- ========================================================= -->
      <!-- BINS (CLICKABLE)                                          -->
      <!-- ========================================================= -->

      <a-cylinder
        position="-3 0.5 -4"
        radius="0.6"
        height="1"
        color="brown"
        class="bin"
        data-bin="organic"
        make-clickable
      ></a-cylinder>

      <a-cylinder
        position="0 0.5 -4"
        radius="0.6"
        height="1"
        color="blue"
        class="bin"
        data-bin="plastic"
        make-clickable
      ></a-cylinder>

      <a-cylinder
        position="3 0.5 -4"
        radius="0.6"
        height="1"
        color="grey"
        class="bin"
        data-bin="metal"
        make-clickable
      ></a-cylinder>

      <!-- ========================================================= -->
      <!-- UI: SCORE + RESET + HOME                                 -->
      <!-- ========================================================= -->

      <a-entity position="0 2 -2">
        <a-text
          id="scoreText"
          value="Score: 0"
          align="center"
          color="black"
          width="4"
          position="0 0.4 0"
        ></a-text>

        <a-plane
          id="resetBtn3D"
          make-clickable
          color="#ff5555"
          width="1.2"
          height="0.4"
          position="0 -0.3 0"
        >
          <a-text
            value="RESET"
            color="white"
            align="center"
            width="2"
            position="0 0 0.01"
          ></a-text>
        </a-plane>

        <a-plane
          id="homeButton"
          make-clickable
          color="#5555ff"
          width="1.2"
          height="0.4"
          position="0 -0.9 0"
        >
          <a-text
            value="HOME"
            color="white"
            align="center"
            width="2"
            position="0 0 0.01"
          ></a-text>
        </a-plane>
      </a-entity>

    </a-scene>
  </body>
</html>
